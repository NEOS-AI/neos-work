# Live multi-replica collab + run event e2e (Redis + two engines).
# Structural multi-replica checks already run in ci.yml on every PR.
# v0.22 M2: scheduled nightly + manual dispatch; L1–L11 live cases.
name: Nightly multi-replica live

on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-multi-replica
  cancel-in-progress: true

jobs:
  multi-replica-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + server (live e2e needs dist)
        run: |
          pnpm --filter @neos-work/shared build
          pnpm --filter @neos-work/core build
          pnpm --filter @neos-work/workflow-engine build
          pnpm --filter @neos-work/mcp-client build
          pnpm --filter @neos-work/browser-tool build
          pnpm --filter @neos-work/agent-runtime build
          pnpm --filter @neos-work/plugin-runtime build
          pnpm --filter @neos-work/server build

      - name: Multi-replica structural e2e
        run: pnpm e2e:multi-replica

      - name: Multi-replica live e2e (Redis service + dual engines)
        run: pnpm e2e:multi-replica:live
        env:
          NEOS_MULTI_REPLICA_VERBOSE: '0'
          NEOS_COLLAB_REDIS_URL: redis://127.0.0.1:6379
          # Use the workflow Redis service; skip docker run inside the script
          # (script flag --skip-redis-docker still starts only if no URL — URL is set)
        # Retry once on flake (port bind / redis ready race)
      - name: Multi-replica live e2e (retry on failure)
        if: failure()
        run: |
          sleep 5
          pnpm e2e:multi-replica:live
        env:
          NEOS_MULTI_REPLICA_VERBOSE: '1'
          NEOS_COLLAB_REDIS_URL: redis://127.0.0.1:6379
