<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OD Sample — Landing</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; }
    header { padding: 1.5rem 2rem; border-bottom: 1px solid #ccc3; }
    main { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    .hero { padding: 2rem; border-radius: 12px; background: #4f46e522; }
    .hero h1 { margin-top: 0; }
  </style>
</head>
<body>
  <header data-neos-name="Top bar">
    <strong>NEOS Design Sample</strong>
  </header>
  <main>
    <section class="hero" id="hero">
      <h1>Open Design fixture</h1>
      <p>Used by Design Editor e2e: Layers tree, Inspect, and file revisions.</p>
      <button type="button">Get started</button>
    </section>
  </main>
</body>
</html>
