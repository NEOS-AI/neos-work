# NEOS Work multi-replica compose (optional collab testing)
# Standalone — does not replace deploy/docker-compose.yml (single-engine).
#
# Usage (from monorepo root):
#   cp deploy/.env.example deploy/.env   # set NEOS_AUTH_TOKEN
#   docker compose -f deploy/docker-compose.multi.yml up -d --build
#   docker compose -f deploy/docker-compose.multi.yml logs -f
#
# Engines: neos-a :3000, neos-b :3001 — shared Redis bus/presence.
# Volumes are separate by default (safer for SQLite). For shared-data /
# single-writer experiments, mount the same volume on both services.
# See docs/ops/multi-replica-collab.md

services:
  redis:
    image: redis:7-alpine
    container_name: neos-work-redis
    restart: unless-stopped
    ports:
      - "${NEOS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  neos-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: neos-work:0.8.6
    container_name: neos-work-a
    restart: unless-stopped
    ports:
      - "${NEOS_PORT_A:-3000}:3000"
    environment:
      NEOS_HOST: "0.0.0.0"
      NEOS_PORT: "3000"
      NEOS_DATA_DIR: /data
      NEOS_ALLOW_ANY_HOST: "1"
      NEOS_AUTH_TOKEN: "${NEOS_AUTH_TOKEN:?Set NEOS_AUTH_TOKEN in deploy/.env}"
      NEOS_CORS_ORIGINS: "${NEOS_CORS_ORIGINS:-}"
      NEOS_ALLOWED_HOSTS: "${NEOS_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000,localhost:3001,127.0.0.1:3001}"
      NEOS_COLLAB_BUS: redis
      NEOS_COLLAB_REDIS_URL: redis://redis:6379
      NEOS_COLLAB_PRESENCE: auto
    volumes:
      - neos_data_a:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  neos-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: neos-work:0.8.6
    container_name: neos-work-b
    restart: unless-stopped
    ports:
      - "${NEOS_PORT_B:-3001}:3000"
    environment:
      NEOS_HOST: "0.0.0.0"
      NEOS_PORT: "3000"
      NEOS_DATA_DIR: /data
      NEOS_ALLOW_ANY_HOST: "1"
      NEOS_AUTH_TOKEN: "${NEOS_AUTH_TOKEN:?Set NEOS_AUTH_TOKEN in deploy/.env}"
      NEOS_CORS_ORIGINS: "${NEOS_CORS_ORIGINS:-}"
      NEOS_ALLOWED_HOSTS: "${NEOS_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000,localhost:3001,127.0.0.1:3001}"
      NEOS_COLLAB_BUS: redis
      NEOS_COLLAB_REDIS_URL: redis://redis:6379
      NEOS_COLLAB_PRESENCE: auto
    volumes:
      - neos_data_b:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  neos_data_a:
    name: neos_data_a
  neos_data_b:
    name: neos_data_b
