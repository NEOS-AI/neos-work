apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neos-work.fullname" . }}
  labels:
    {{- include "neos-work.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "neos-work.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neos-work.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: neos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: NEOS_HOST
              value: {{ .Values.env.NEOS_HOST | quote }}
            - name: NEOS_PORT
              value: {{ .Values.env.NEOS_PORT | quote }}
            - name: NEOS_DATA_DIR
              value: {{ .Values.env.NEOS_DATA_DIR | quote }}
            - name: NEOS_ALLOW_ANY_HOST
              value: {{ .Values.env.NEOS_ALLOW_ANY_HOST | quote }}
            - name: NEOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "neos-work.fullname" . }}-auth{{ end }}
                  key: {{ if .Values.existingSecretKey }}{{ .Values.existingSecretKey }}{{ else }}token{{ end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "neos-work.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
