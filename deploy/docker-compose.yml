# NEOS Work self-host compose (Task 13)
# Usage:
#   cp deploy/.env.example deploy/.env   # set NEOS_AUTH_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs -f

services:
  neos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: neos-work:0.5.21
    container_name: neos-work
    restart: unless-stopped
    ports:
      - "${NEOS_PORT:-3000}:3000"
    environment:
      NEOS_HOST: "0.0.0.0"
      NEOS_PORT: "3000"
      NEOS_DATA_DIR: /data
      NEOS_ALLOW_ANY_HOST: "1"
      NEOS_AUTH_TOKEN: "${NEOS_AUTH_TOKEN:?Set NEOS_AUTH_TOKEN in deploy/.env}"
      NEOS_CORS_ORIGINS: "${NEOS_CORS_ORIGINS:-}"
      NEOS_ALLOWED_HOSTS: "${NEOS_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}"
    volumes:
      - neos_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  neos_data:
    name: neos_data
